<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col>
        <div class="display">
          <ion-input id="sleeptimer-input" name="minutes" value="60" readonly (ionFocus)="focusChanged($event)" (ionInput)="inputChanged($event)"></ion-input>
        </div>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col>
        <div id="keyboard"></div>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col size="6">
        <ion-button expand="block" color="medium" (click)="closeCancel()">Cancel</ion-button>
      </ion-col>
      <ion-col size="6">
        <ion-button expand="block" color="primary" (click)="closeStart()">Start</ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
